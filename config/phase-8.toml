# Keep this line so VS Code validates and completes this file with our JSON Schema.
#:schema ./schema.json

# Phase 8 clean-image package and systemd acceptance configuration.
schema_version = 1

[product]
name = "Onboardd"
device_name = "Phase 8 display"

[branding]
primary_color = "#cd2455"
background_color = "#f8eff3"

[branding.text]
title = "Set up the Phase 8 display"
subtitle = "Verify the packaged service and its network recovery."

[network]
interface = "wlan0"
requirement = "local"
infrastructure_enabled = true
standalone_enabled = true

[network.provisioning]
ssid = "Onboardd-P8-Setup-{{ .DeviceID }}"
password_file = "/etc/onboardd/provisioning-password"

[network.standalone]
ssid = "Onboardd-P8-AP-{{ .DeviceID }}"
password_file = "/etc/onboardd/standalone-password"
address = "10.42.0.1/24"

[portal]
listener_port = 18080

[handoff]
show_standalone_credentials = true

[recovery.gpio]
enabled = false
chip = "/dev/gpiochip0"
line = 17
