# Keep this line so VS Code validates and completes this file with our JSON Schema.
#:schema ./schema.json

# Phase 7 Raspberry Pi acceptance configuration.
schema_version = 1

[product]
# Product family and friendly device name shown in the setup interface.
name = "InkyPi"
device_name = "Photo display"

[branding]
# Leave logo unset to use onboardd's built-in wireless mark.
primary_color = "#cd2455"
background_color = "#f8eff3"

[branding.text]
title = "Set up your photo display"
subtitle = "Connect InkyPi to Wi-Fi or use it as a standalone display."

[network]
# NetworkManager interface controlled by onboardd.
interface = "wlan0"
# A working LAN is sufficient; confirmed Internet access is not required.
requirement = "local"
infrastructure_enabled = true
standalone_enabled = true

[network.provisioning]
# Temporary setup SSID. DeviceID keeps names unique without exposing machine-id.
ssid = "InkyPi-Setup-{{ .DeviceID }}"
password_file = "/etc/onboardd/provisioning-password"

[network.standalone]
# Persistent standalone SSID, credentials, and local shared subnet.
ssid = "InkyPi-Standalone-{{ .DeviceID }}"
password_file = "/etc/onboardd/standalone-password"
address = "10.42.0.1/24"

[portal]
# Private setup UI listener. Captive-portal detection continues to use port 80.
listener_port = 18080

[handoff]
# .Hostname resolves to the hostname already managed by the Pi and Avahi.
application_label = "Open InkyPi"
application_url = "http://{{ .Hostname }}.local/"
# InkyPi occupies port 80, so its root page is used as the readiness check.
health_check_url = "http://127.0.0.1/"
# Show the standalone password and Wi-Fi QR around the network handoff.
show_standalone_credentials = true

[recovery.gpio]
# Keep hardware recovery disabled until the optional GPIO checklist step.
enabled = false
chip = "/dev/gpiochip0"
line = 17
