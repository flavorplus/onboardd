# Example configuration for an InkyPi display.
schema_version = 1

[product]
name = "InkyPi"
device_name = "Kitchen display"

[branding]
primary_color = "#2455cd"
background_color = "#eff3f8"

[branding.text]
title = "Set up {{ .DeviceName }}"
subtitle = "Choose how this InkyPi display should connect."

[network]
interface = "wlan0"
requirement = "local"
infrastructure_enabled = true
standalone_enabled = true

[network.provisioning]
ssid = "InkyPi-Setup-{{ .DeviceID }}"
password_file = "/etc/onboardd/provisioning-password"

[network.standalone]
ssid = "InkyPi-{{ .DeviceID }}"
password_file = "/etc/onboardd/standalone-password"
address = "10.42.0.1/24"

[portal]
listener_port = 18080
password_file = "/etc/onboardd/admin-password"

[handoff]
application_label = "Open InkyPi"
application_url = "http://{{ .Hostname }}.local/"
health_check_url = "http://127.0.0.1/"
show_standalone_credentials = false
