# Phase 5 acceptance fixture. The SVG is a generic test mark, not an Anthias trademark.
schema_version = 1

[product]
name = "Anthias"
device_name = "Lobby player"

[branding]
logo = "/etc/onboardd/anthias-acceptance.svg"
primary_color = "#cd2455"
background_color = "#f8eff3"

[branding.text]
title = "Set up {{ .DeviceName }}"
subtitle = "Connect this Anthias player or keep it available as its own network."

[network]
interface = "wlan0"
requirement = "local"
infrastructure_enabled = true
standalone_enabled = true

[network.provisioning]
ssid = "Anthias-Setup-{{ .DeviceID }}"
password_file = "/etc/onboardd/provisioning-password"

[network.standalone]
ssid = "Anthias-{{ .DeviceID }}"
password_file = "/etc/onboardd/standalone-password"
address = "10.42.0.1/24"

[portal]
listener_port = 18080
