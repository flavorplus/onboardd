# Phase 6 acceptance fixture: unavailable application and hidden standalone credentials.
schema_version = 1

[product]
name = "Onboardd"
device_name = "Phase 6 display"

[branding]
primary_color = "#cd2455"
background_color = "#f8eff3"

[branding.text]
title = "Set up {{ .DeviceName }}"
subtitle = "Verify private standalone handoff and an unavailable application."

[network]
interface = "wlan0"
requirement = "local"
infrastructure_enabled = true
standalone_enabled = true

[network.provisioning]
ssid = "Onboardd-Setup-{{ .DeviceID }}"
password_file = "/etc/onboardd/provisioning-password"

[network.standalone]
ssid = "Onboardd-Standalone-{{ .DeviceID }}"
password_file = "/etc/onboardd/standalone-password"
address = "10.42.0.1/24"

[portal]
listener_port = 18080

[handoff]
application_label = "Open unavailable test application"
application_url = "http://{{ .Hostname }}.local:9/"
# TCP port 9 is intentionally unused for this negative readiness test.
health_check_url = "http://127.0.0.1:9/"
show_standalone_credentials = false
